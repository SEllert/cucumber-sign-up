# .github/workflows/ci.yml
name: E2E Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run report:generate
      - uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/html